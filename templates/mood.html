<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mirror - Mood Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }

    .font-journal {
      font-family: 'Homemade Apple', cursive;
    }

    .font-body {
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .paper-bg {
      background-color: #faf8f5;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    }

    .ink-text {
      color: #3d3a37;
    }

    .ink-light {
      color: #6b6560;
    }

    .ink-faint {
      color: #9a9590;
    }

    .border-ink {
      border-color: #d4d0cb;
    }

    .mood-btn {
      transition: all 0.2s ease;
    }

    .mood-btn:hover {
      background-color: rgba(61, 58, 55, 0.05);
    }

    .mood-btn.selected {
      background-color: rgba(61, 58, 55, 0.08);
      border-color: #3d3a37;
    }

    .save-btn {
      transition: all 0.2s ease;
    }

    .save-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .save-btn:not(:disabled):hover {
      background-color: #3d3a37;
      color: #faf8f5;
    }

    textarea::placeholder {
      font-style: italic;
      color: #9a9590;
    }

    .entry-card {
      border-bottom: 1px solid #e8e5e0;
    }

    .entry-card:last-child {
      border-bottom: none;
    }

    .fade-in {
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .success-msg {
      animation: fadeInOut 2s ease;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    .glass-surface {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
    }

    .sticker-pill {
      position: absolute;
      border-radius: 999px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      background: #ffe6ec;
      color: #8b5b68;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
      transform: rotate(-6deg);
      pointer-events: none;
      z-index: 1;
      border: 1px dashed rgba(139, 91, 104, 0.35);
      white-space: nowrap;
    }

    .sticker-pill-blue {
      background: #e4f0ff;
      color: #4b607e;
      border-color: rgba(75, 96, 126, 0.35);
      transform: rotate(4deg);
    }

    .sticker-pill-green {
      background: #e9f7ec;
      color: #4a6b54;
      border-color: rgba(74, 107, 84, 0.35);
      transform: rotate(-3deg);
    }

    .washi-strip {
      position: absolute;
      width: 90px;
      height: 18px;
      background: repeating-linear-gradient(
        -45deg,
        rgba(248, 207, 160, 0.9),
        rgba(248, 207, 160, 0.9) 6px,
        rgba(249, 227, 198, 0.9) 6px,
        rgba(249, 227, 198, 0.9) 12px
      );
      opacity: 0.9;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      pointer-events: none;
      z-index: 1;
    }

    .doodle-heart {
      position: absolute;
      font-size: 13px;
      color: #e19aa5;
      opacity: 0.95;
      pointer-events: none;
      z-index: 1;
    }

    .doodle-star {
      position: absolute;
      font-size: 11px;
      color: #d3a27f;
      opacity: 0.85;
      pointer-events: none;
      z-index: 1;
    }

    @media (max-width: 1023px) {
      .gutter-decor {
        opacity: 0.7;
      }
    }

    @media (max-width: 640px) {
      .sticker-pill:not(.sticker-main),
      .doodle-heart:not(.doodle-main),
      .doodle-star:not(.doodle-main) {
        display: none;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
</head>

<!-- Mood Chatbot -->
<div id="mood-chatbot" class="fixed bottom-4 right-4 sm:bottom-5 sm:right-5 z-50">
  <button
    id="chat-toggle"
    class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-[#3d3a37] text-white text-lg sm:text-xl shadow-lg flex items-center justify-center"
  >
    💬
  </button>

  <div
    id="chat-window"
    class="hidden w-72 sm:w-80 h-80 sm:h-96 rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-white/30 bg-white/10 backdrop-blur-xl"
  >
    <div class="px-4 py-3 border-b border-white/20 flex items-center justify-between">
      <div class="text-xs font-semibold tracking-wide uppercase text-white/80">
        Mirror Companion
      </div>
      <span class="text-[10px] text-white/60">mood check-in</span>
    </div>

    <div
      id="chat-messages"
      class="flex-1 p-3 space-y-2 text-sm overflow-y-auto bg-gradient-to-b from-white/40 via-white/20 to-transparent"
    >
      <div class="chat-message flex justify-start">
        <div
          class="bg-white/80 border border-white/40 rounded-2xl px-3 py-2 text-[13px] text-[#2d2d2d] shadow-sm"
        >
          Hi, I’m here to sit with you while you feel what you’re feeling. How does today feel so far?
        </div>
      </div>
    </div>

    <div class="px-3 py-3 border-t border-white/20 bg-white/30 backdrop-blur-sm">
      <div class="flex items-center gap-2">
        <input
          id="chat-input"
          type="text"
          placeholder="Share what’s on your heart..."
          class="flex-1 text-xs px-3 py-2 rounded-full bg-white/70 border border-white/60 text-[#2d2d2d] focus:outline-none focus:ring-0"
        >
        <button
          id="send-btn"
          class="px-3 py-2 rounded-full text-xs font-medium bg-[#2d2d2d] text-white hover:bg-black/90 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Send
        </button>
      </div>
    </div>
  </div>
</div>

<body class="h-full paper-bg font-body text-[14px] sm:text-[15px]">
  <div id="app-wrapper" class="min-h-screen w-full overflow-auto">
    <div class="relative w-full px-4 sm:px-6 lg:px-10 xl:px-16 py-5 lg:py-8">
      <div class="sticker-pill sticker-main"
           style="top: 20px; left: 350px;">
        today’s moods
      </div>

      <div class="doodle-heart doodle-main"
           style="top: 60px; left: 26px;">
        ❤
      </div>

      <div class="doodle-heart doodle-main"
           style="top: 70px; right: 34px;">
        ❤
      </div>

      <div class="doodle-heart"
           style="bottom: -150px; left: 300px;">
        ❤
      </div>

      <div class="doodle-heart"
           style="bottom: 20px; left: 12px;">
        ❤
      </div>

      <div class="sticker-pill sticker-main"
           style="bottom: 50px; right: 90px;">
        check-in
      </div>

      <div class="doodle-heart"
           style="bottom: 56px; right: 40px;">
        ❤
      </div>

      <div class="w-full">
        <!-- Header -->
        <header class="mb-6 lg:mb-8">
          <div class="flex items-center gap-2 sm:gap-3 mb-2 sm:mb-3">
            <button id="back-btn"
                    class="ink-light hover:ink-text transition-colors text-base sm:text-lg"
                    aria-label="Go back"
                    onclick="window.location.href='/dashboard';">←</button>
            <h1 id="page-title" class="font-journal text-xl sm:text-3xl ink-text">Mood Tracker</h1>
          </div>
          <p id="page-subtitle" class="ink-light text-[13px] sm:text-sm md:text-base ml-7 mb-1">How are you feeling today?</p>
          <p id="date-display" class="ink-faint text-[11px] sm:text-xs md:text-sm ml-7 italic"></p>
        </header>

        <!-- Main layout -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6 lg:gap-8">
          <!-- Left: today's mood + reflection -->
          <div class="lg:col-span-2 space-y-6 sm:space-y-8">
            <!-- Today's Mood Section -->
            <section class="mb-0">
              <div class="border border-ink rounded-lg p-3 sm:p-5 bg-white/30 glass-surface">
                <!-- Mood Selection -->
                <div class="mb-5 sm:mb-6">
                  <p class="ink-light text-[13px] sm:text-sm mb-3 sm:mb-4">Select your mood:</p>
                  <div id="mood-grid"
                       class="grid grid-cols-5 gap-1.5 sm:gap-2 justify-items-center">
                  </div>
                </div>
                <!-- Selected Mood Display -->
                <div id="selected-mood-display" class="mb-5 sm:mb-6 hidden">
                  <p class="ink-light text-[13px] sm:text-sm italic"></p>
                </div>
                <!-- Reflection Input -->
                <div class="mb-5 sm:mb-6">
                  <label for="reflection-input" id="reflection-label" class="block ink-light text-[13px] sm:text-sm mb-2">
                    What's on your mind? (optional)
                  </label>
                  <textarea
                    id="reflection-input"
                    class="w-full h-24 p-3 border border-ink rounded bg-transparent ink-text text-[13px] sm:text-sm resize-none focus:outline-none focus:border-[#3d3a37]"
                    placeholder="A few words about your day..."></textarea>
                </div>
                <!-- Save Button -->
                <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                  <button id="save-btn" class="save-btn px-4 sm:px-5 py-1.5 sm:py-2 border border-ink rounded ink-text text-[13px] sm:text-sm" disabled>
                    Save Today's Mood
                  </button>
                  <span id="success-message" class="ink-light text-[12px] sm:text-sm italic hidden"></span>
                </div>
              </div>
            </section>

            <!-- Daily Reflection Section -->
            <section class="mb-0">
              <h2 class="font-journal text-base sm:text-lg ink-text mb-2 sm:mb-3">Daily Reflection</h2>
              <div class="border-l-2 border-ink pl-3 sm:pl-4">
                <p id="daily-reflection" class="ink-light text-[13px] sm:text-sm italic leading-relaxed"></p>
              </div>
            </section>
          </div>

          <!-- Right: entries + weekly summary -->
          <div class="space-y-6 sm:space-y-8">
            <!-- Recent Entries Section -->
            <section class="mb-0">
              <div class="flex items-baseline justify-between mb-2 sm:mb-3">
                <h2 class="font-journal text-base sm:text-lg ink-text">Recent Entries</h2>
                <span id="entry-count" class="ink-faint text-[11px] sm:text-xs"></span>
              </div>
              <div id="entries-container" class="border border-ink rounded-lg bg-white/30 glass-surface max-h-72 sm:max-h-80 overflow-y-auto">
              </div>
            </section>

            <!-- Weekly Summary Section -->
            <section class="mb-0">
              <h2 class="font-journal text-base sm:text-lg ink-text mb-2 sm:mb-3">Weekly Summary</h2>
              <div id="weekly-summary" class="border border-ink rounded-lg p-3 sm:p-5 bg-white/30 glass-surface">
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // Configuration
  const defaultConfig = {
    page_title: 'Mood Tracker',
    page_subtitle: 'How are you feeling today?',
    reflection_label: "What's on your mind? (optional)",
    background_color: '#faf8f5',
    text_color: '#3d3a37',
    accent_color: '#6b6560',
    surface_color: '#ffffff',
    border_color: '#d4d0cb',
    font_family: 'Source Serif 4',
    font_size: 16
  };

  let config = { ...defaultConfig };

  // Mood definitions
  const moods = [
    { emoji: '😊', name: 'Happy' },
    { emoji: '😌', name: 'Calm' },
    { emoji: '😐', name: 'Neutral' },
    { emoji: '😴', name: 'Tired' },
    { emoji: '😰', name: 'Anxious' },
    { emoji: '😔', name: 'Sad' },
    { emoji: '😤', name: 'Frustrated' },
    { emoji: '🤗', name: 'Excited' },
    { emoji: '🙏', name: 'Grateful' },
    { emoji: '😢', name: 'Stressed' }
  ];

  // Daily reflections
  const reflections = [
    "🌿 Notice what you're feeling without trying to change it.",
    "🌙 Some days are heavier than others. That's okay.",
    "☁️ Emotions are visitors. They come and go.",
    "🍃 What would feel gentle right now?",
    "🌸 You don't have to have it all figured out today.",
    "💧 Sometimes rest is the most productive thing.",
    "🌾 Small moments of peace still count.",
    "🕊️ It's enough to simply notice how you feel.",
    "🌿 Be patient with yourself. Growth takes time.",
    "☀️ Even cloudy days have their own quiet beauty.",
    "🌊 Let your feelings be what they are.",
    "🍂 Not every day needs to be remarkable."
  ];

  // State
  let selectedMood = null;
  let allEntries = [];
  let isLoading = false;

  const moodResponses = {
  Happy: [
    "That lightness really shows on you today.",
    "Hold onto this feeling—let it remind you of what supports you.",
    "Maybe note one small moment from today that you’d like to remember."
  ],
  Calm: [
    "Peaceful moments like this are worth noticing.",
    "You don’t have to rush out of this calm. You’re allowed to enjoy it.",
    "Stillness is its own kind of progress."
  ],
  Sad: [
    "I’m really glad you checked in while feeling this way.",
    "You don’t have to fix everything today; feeling is already an effort.",
    "It’s okay if today feels heavy. You’re allowed to move slowly."
  ],
  Anxious: [
    "Pause for a second—take one slow breath in, and one slow breath out.",
    "Your thoughts are busy, but you are not your thoughts.",
    "You don’t need to solve everything right now. One small step is enough."
  ],
  Stressed: [
    "It sounds like you’ve been carrying a lot.",
    "Try unclenching your jaw and relaxing your shoulders for a moment.",
    "It’s okay to take a short break, even in the middle of a busy day."
  ],
  Frustrated: [
    "That feeling of frustration makes sense when things matter to you.",
    "You’re allowed to be upset and still be a good person.",
    "Maybe step back for a moment before you respond to whatever’s bothering you."
  ],
  Tired: [
    "Needing rest doesn’t make you weak.",
    "Your body and mind might be asking for a softer pace.",
    "Even small pauses count as real rest."
  ],
  Grateful: [
    "Noticing gratitude is a powerful habit.",
    "Savor this—tiny good moments add up over time.",
    "You can come back to this feeling on harder days."
  ],
  Excited: [
    "That spark you’re feeling is important—pay attention to it.",
    "It’s nice to see this energy in your check‑in.",
    "Maybe write down what you’re excited about so you can revisit it later."
  ],
  Neutral: [
    "Not every day needs a big emotion, and that’s completely okay.",
    "Neutral days can be quiet breathing spaces between the louder ones.",
    "You can still be curious about what you need, even on neutral days."
  ]
};


  const genericResponses = [
    "I’m here with you 🤍",
    "Thank you for checking in.",
    "Your feelings make sense.",
    "Be gentle with yourself today."
  ];

  function getTodayDateString() {
    const now = new Date();
    return now.toISOString().split('T')[0];
  }

  function formatDisplayDate(date) {
    const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    return date.toLocaleDateString('en-GB', options);
  }

  function formatEntryDate(dateString) {
    const date = new Date(dateString);
    const options = { weekday: 'short', day: 'numeric', month: 'short' };
    return date.toLocaleDateString('en-GB', options);
  }

  function getRandomReflection() {
    return reflections[Math.floor(Math.random() * reflections.length)];
  }

  function getWeekStart() {
    const now = new Date();
    const dayOfWeek = now.getDay();
    const diff = now.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
    const weekStart = new Date(now.setDate(diff));
    weekStart.setHours(0, 0, 0, 0);
    return weekStart;
  }

  function initMoodGrid() {
    const grid = document.getElementById('mood-grid');
    grid.innerHTML = '';

    moods.forEach(mood => {
      const btn = document.createElement('button');
      btn.className = 'mood-btn flex flex-col items-center justify-center gap-1 p-2 sm:p-3 border border-ink rounded text-center w-14 sm:w-16';
      btn.setAttribute('data-mood', mood.name);
      btn.setAttribute('aria-label', mood.name);
      btn.innerHTML = `
        <span class="text-xl sm:text-2xl leading-none block">${mood.emoji}</span>
        <span class="ink-faint text-[10px] sm:text-xs leading-tight break-words">${mood.name}</span>
      `;
      btn.addEventListener('click', () => selectMood(mood));
      grid.appendChild(btn);
    });
  }

  function selectMood(mood) {
    selectedMood = mood;

    document.querySelectorAll('.mood-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.mood === mood.name);
    });

    const display = document.getElementById('selected-mood-display');
    display.classList.remove('hidden');
    display.querySelector('p').textContent = `${mood.emoji} Feeling ${mood.name.toLowerCase()}`;

    document.getElementById('save-btn').disabled = false;
  }

  async function saveMood() {
    if (!selectedMood || isLoading) return;

    isLoading = true;
    const saveBtn = document.getElementById('save-btn');
    saveBtn.textContent = 'Saving...';
    saveBtn.disabled = true;

    const reflection = document.getElementById('reflection-input').value.trim();
    const today = getTodayDateString();

    try {
      const newEntry = {
        mood_emoji: selectedMood.emoji,
        mood_name: selectedMood.name,
        reflection: reflection,
        date: today,
        timestamp: Date.now()
      };

      const result = await window.dataSdk.create(newEntry);

      if (!result.isOk) {
        throw new Error('Failed to save mood');
      }

      showMessage('Mood saved');
      document.getElementById('reflection-input').value = '';
      triggerMoodResponse(newEntry);

    } catch (error) {
      console.error(error);
      showMessage('Could not save. Please try again.');
    } finally {
      isLoading = false;
      saveBtn.textContent = 'Save Mood';
      saveBtn.disabled = !selectedMood;
    }
  }

  function showMessage(text) {
    const msgEl = document.getElementById('success-message');
    msgEl.textContent = text;
    msgEl.classList.remove('hidden');
    msgEl.classList.add('success-msg');

    setTimeout(() => {
      msgEl.classList.add('hidden');
      msgEl.classList.remove('success-msg');
    }, 2000);
  }

  function renderEntries(entries) {
    const container = document.getElementById('entries-container');
    const countEl = document.getElementById('entry-count');

    if (entries.length === 0) {
      container.innerHTML = `
        <p class="ink-faint text-[13px] sm:text-sm italic p-4 sm:p-5 text-center">No moods recorded yet.</p>
      `;
      countEl.textContent = '';
      return;
    }

    const sorted = [...entries].sort((a, b) => b.timestamp - a.timestamp).slice(0, 3);
    countEl.textContent = `${entries.length} ${entries.length === 1 ? 'entry' : 'entries'}`;

    container.innerHTML = sorted.map(entry => `
      <div class="entry-card p-3 sm:p-4">
        <div class="flex items-start gap-2 sm:gap-3">
          <span class="text-lg sm:text-xl">${entry.mood_emoji}</span>
          <div class="flex-1 min-w-0">
            <div class="flex items-baseline justify-between gap-2 mb-0.5 sm:mb-1">
              <span class="ink-text text-[13px] sm:text-sm">${entry.mood_name}</span>
              <span class="ink-faint text-[11px] sm:text-xs">${formatEntryDate(entry.date)}</span>
            </div>
            ${entry.reflection ? `<p class="ink-light text-[12px] sm:text-sm italic truncate">${entry.reflection}</p>` : ''}
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderWeeklySummary(entries) {
    const container = document.getElementById('weekly-summary');
    const weekStart = getWeekStart();

    const weekEntries = entries.filter(e => e.timestamp >= weekStart.getTime());

    if (weekEntries.length === 0) {
      container.innerHTML = `
        <p class="ink-faint text-[13px] sm:text-sm italic">No moods recorded this week yet.</p>
      `;
      return;
    }

    const moodCounts = {};
    weekEntries.forEach(e => {
      const key = `${e.mood_emoji}|${e.mood_name}`;
      moodCounts[key] = (moodCounts[key] || 0) + 1;
    });

    const mostCommon = Object.entries(moodCounts)
      .sort((a, b) => b[1] - a[1])[0][0]
      .split('|');

    let trend = 'Stable';
    if (weekEntries.length >= 3) {
      const positiveNames = ['Happy', 'Calm', 'Excited', 'Grateful'];
      const sorted = [...weekEntries].sort((a, b) => a.timestamp - b.timestamp);
      const midpoint = Math.floor(sorted.length / 2);

      const firstHalfPositive = sorted.slice(0, midpoint).filter(e => positiveNames.includes(e.mood_name)).length;
      const secondHalfPositive = sorted.slice(midpoint).filter(e => positiveNames.includes(e.mood_name)).length;

      const firstRatio = firstHalfPositive / midpoint;
      const secondRatio = secondHalfPositive / (sorted.length - midpoint);

      if (secondRatio > firstRatio + 0.2) {
        trend = 'Improving';
      } else if (secondRatio < firstRatio - 0.2) {
        trend = 'Declining';
      }
    }

    container.innerHTML = `
      <div class="space-y-2 sm:space-y-3">
        <div class="flex items-baseline justify-between">
          <span class="ink-light text-[13px] sm:text-sm">Most common mood</span>
          <span class="ink-text text-[13px] sm:text-sm">${mostCommon[0]} ${mostCommon[1]}</span>
        </div>
        <div class="flex items-baseline justify-between">
          <span class="ink-light text-[13px] sm:text-sm">Mood trend</span>
          <span class="ink-text text-[13px] sm:text-sm italic">${trend}</span>
        </div>
        <div class="flex items-baseline justify-between">
          <span class="ink-light text-[13px] sm:text-sm">Entries this week</span>
          <span class="ink-text text-[13px] sm:text-sm">${weekEntries.length}</span>
        </div>
      </div>
    `;
  }

  function onDataChanged(data) {
    allEntries = data || [];
    document.getElementById('save-btn').textContent = 'Save Mood';
    renderEntries(allEntries);
    renderWeeklySummary(allEntries);
  }

  async function onConfigChange(cfg) {
    config = { ...defaultConfig, ...cfg };

    document.getElementById('page-title').textContent = config.page_title || defaultConfig.page_title;
    document.getElementById('page-subtitle').textContent = config.page_subtitle || defaultConfig.page_subtitle;
    document.getElementById('reflection-label').textContent = config.reflection_label || defaultConfig.reflection_label;

    document.documentElement.style.setProperty('--bg-color', config.background_color || defaultConfig.background_color);
    document.documentElement.style.setProperty('--text-color', config.text_color || defaultConfig.text_color);

    const fontFamily = config.font_family || defaultConfig.font_family;
    document.querySelectorAll('.font-body').forEach(el => {
      el.style.fontFamily = `${fontFamily}, Georgia, serif`;
    });

    const baseSize = config.font_size || defaultConfig.font_size;
    document.body.style.fontSize = `${baseSize}px`;
  }

  function mapToCapabilities(cfg) {
    return {
      recolorables: [
        {
          get: () => cfg.background_color || defaultConfig.background_color,
          set: (v) => { cfg.background_color = v; window.elementSdk.setConfig({ background_color: v }); }
        },
        {
          get: () => cfg.surface_color || defaultConfig.surface_color,
          set: (v) => { cfg.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); }
        },
        {
          get: () => cfg.text_color || defaultConfig.text_color,
          set: (v) => { cfg.text_color = v; window.elementSdk.setConfig({ text_color: v }); }
        },
        {
          get: () => cfg.accent_color || defaultConfig.accent_color,
          set: (v) => { cfg.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); }
        },
        {
          get: () => cfg.border_color || defaultConfig.border_color,
          set: (v) => { cfg.border_color = v; window.elementSdk.setConfig({ border_color: v }); }
        }
      ],
      borderables: [],
      fontEditable: {
        get: () => cfg.font_family || defaultConfig.font_family,
        set: (v) => { cfg.font_family = v; window.elementSdk.setConfig({ font_family: v }); }
      },
      fontSizeable: {
        get: () => cfg.font_size || defaultConfig.font_size,
        set: (v) => { cfg.font_size = v; window.elementSdk.setConfig({ font_size: v }); }
      }
    };
  }

  function mapToEditPanelValues(cfg) {
    return new Map([
      ['page_title', cfg.page_title || defaultConfig.page_title],
      ['page_subtitle', cfg.page_subtitle || defaultConfig.page_subtitle],
      ['reflection_label', cfg.reflection_label || defaultConfig.reflection_label]
    ]);
  }

  async function init() {
    document.getElementById('date-display').textContent = formatDisplayDate(new Date());
    document.getElementById('daily-reflection').textContent = getRandomReflection();
    initMoodGrid();
    document.getElementById('save-btn').addEventListener('click', saveMood);

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }

    if (window.dataSdk) {
      const result = await window.dataSdk.init({
        onDataChanged
      });
      if (!result.isOk) {
        console.error('Failed to initialize Data SDK');
      }
    }
  }

  init();

  // ----- CHATBOT: richer, mood-aware -----
  const chatToggle = document.getElementById('chat-toggle');
  const chatWindow = document.getElementById('chat-window');
  const chatInput = document.getElementById('chat-input');
  const chatMessages = document.getElementById('chat-messages');
  const sendBtn = document.getElementById('send-btn');

  const patternResponses = {
    'positive-streak': [
      "You’ve been feeling consistently lighter lately 🌤️",
      "There’s a gentle upward pattern in your moods.",
      "Your recent check-ins carry a softer tone."
    ],
    'negative-streak': [
      "You’ve been holding a lot for a few days now.",
      "Your check-ins look heavy lately—I’m glad you’re still here.",
      "This pattern tells me you might be tired in more than one way."
    ],
    'repeating': [
      "This feeling seems to be visiting more than once.",
      "Your mood has been sitting in a similar place recently.",
      "Maybe this emotion is asking for a bit more attention."
    ],
    'improving': [
      "Your mood seems to be slowly lifting compared to before.",
      "There’s a subtle softening in how your last entries feel.",
      "Tiny shifts upward still count as real change."
    ],
    'declining': [
      "Your recent moods look a little heavier than before.",
      "It seems like something might be pulling you down lately.",
      "Your entries hint at some emotional fatigue."
    ],
    'mixed': [
      "Your feelings have been quite mixed lately.",
      "There’s a lot of variety in your moods—life might be full right now.",
      "It looks like you’re moving through many emotional spaces."
    ]
  };

  const smallTalk = {
    hello: [
      "Hey, I’m glad you opened this.",
      "Hi there. How does your heart feel today?",
      "Hello — I’m here with you for a bit."
    ],
    thanks: [
      "You’re welcome 🤍",
      "I’m glad I could be here with you.",
      "Anytime. You don’t have to hold things alone."
    ]
  };

  function analyzeLastThreeMoods() {
    if (!allEntries || allEntries.length < 2) return null;

    const recent = [...allEntries]
      .sort((a, b) => b.timestamp - a.timestamp)
      .slice(0, 3);

    const names = recent.map(e => e.mood_name);

    const positive = ['Happy', 'Calm', 'Excited', 'Grateful'];
    const negative = ['Sad', 'Anxious', 'Stressed', 'Frustrated', 'Tired'];

    const posCount = names.filter(n => positive.includes(n)).length;
    const negCount = names.filter(n => negative.includes(n)).length;

    if (posCount === recent.length) return 'positive-streak';
    if (negCount === recent.length) return 'negative-streak';
    if (names[0] === names[1]) return 'repeating';
    if (posCount > negCount) return 'improving';
    if (negCount > posCount) return 'declining';

    return 'mixed';
  }

  function addChatMessage(text, from = 'bot') {
    const div = document.createElement('div');
    div.className = from === 'bot'
      ? 'chat-message flex justify-start'
      : 'chat-message flex justify-end';
    div.innerHTML = `
      <div class="${
        from === 'bot'
          ? 'bg-white/80 border border-[#e8e5dc]'
          : 'bg-[#2d2d2d] text-white'
      } rounded-3xl px-4 py-3 max-w-[230px] text-[13px] leading-relaxed shadow-sm">
        <p>${text}</p>
      </div>
    `;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function detectEmotion(text) {
    const t = text.toLowerCase();
    if (t.includes('happy') || t.includes('light') || t.includes('okay') || t.includes('good')) return 'positive';
    if (t.includes('sad') || t.includes('low') || t.includes('down') || t.includes('empty')) return 'sad';
    if (t.includes('anxious') || t.includes('anxiety') || t.includes('panic') || t.includes('worried')) return 'anxious';
    if (t.includes('tired') || t.includes('exhausted') || t.includes('drained')) return 'tired';
    if (t.includes('stressed') || t.includes('pressure') || t.includes('overwhelmed')) return 'stressed';
    return null;
  }

  function detectIntent(text) {
    const t = text.toLowerCase();

    if (/(^|\s)(hi|hello|hey|good morning|good night|good evening)(\W|$)/.test(t)) {
      return 'greeting';
    }
    if (t.includes('thank you') || t.includes('thanks') || t.includes('thx')) {
      return 'thanks';
    }
    if (t.includes('bye') || t.includes('goodnight') || t.includes('good night') || t.includes('see you')) {
      return 'goodbye';
    }
    if (t.includes('who are you') || t.includes('what are you') || t.includes('what can you do')) {
      return 'about_bot';
    }
    if ((t.includes('how are you') || t.includes('hru')) && !t.includes('how am i')) {
      return 'bot_feeling';
    }
    if (t.includes('talk to me') || t.includes('bored') || t.includes('lonely')) {
      return 'small_talk';
    }
    if (t.includes('panic') || t.includes("can't breathe") || t.includes('freaking out')) {
      return 'grounding';
    }
    return 'generic';
  }

  const intentResponses = {
    about_bot: [
      "I’m here to notice patterns in your moods and offer gentle reflections.",
      "Think of me as a quiet companion for emotional check-ins."
    ],
    bot_feeling: [
      "I don’t feel things like humans do, but I’m present with you right now.",
      "I’m focused on holding space for whatever you’re feeling."
    ],
    grounding: [
      "Let’s pause: feel your feet on the ground, take one slow breath in and out.",
      "Look around and name three calm or neutral things you can see."
    ],
    small_talk: [
      "We can talk about anything that’s on your mind, big or small.",
      "If your day were a page in a journal, how would you title it?"
    ],
    goodbye: [
      "Thank you for sharing a bit of yourself today. Take gentle care.",
      "I’m glad we could sit together for a while. You can always come back."
    ]
  };

  function chooseRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  async function generateReplyFromFreeText(message) {
    const emotion = detectEmotion(message);
    const intent = detectIntent(message);

    if (intent === 'greeting') return chooseRandom(smallTalk.hello);
    if (intent === 'thanks') return chooseRandom(smallTalk.thanks);
    if (intent === 'about_bot') return chooseRandom(intentResponses.about_bot);
    if (intent === 'bot_feeling') return chooseRandom(intentResponses.bot_feeling);
    if (intent === 'grounding') return chooseRandom(intentResponses.grounding);
    if (intent === 'small_talk') return chooseRandom(intentResponses.small_talk);
    if (intent === 'goodbye') return chooseRandom(intentResponses.goodbye);

    if (emotion) {
      if (emotion === 'sad') return chooseRandom(moodResponses.Sad);
      if (emotion === 'anxious') return chooseRandom(moodResponses.Anxious);
      if (emotion === 'tired') return chooseRandom(moodResponses.Tired);
      if (emotion === 'stressed') return chooseRandom(moodResponses.Stressed);
      if (emotion === 'positive') return chooseRandom(moodResponses.Happy);
    }

    const mood = selectedMood?.name;
    if (mood && moodResponses[mood]) {
      return chooseRandom(moodResponses[mood]);
    }
    return chooseRandom(genericResponses);
  }

  chatToggle.addEventListener('click', () => {
    chatWindow.classList.toggle('hidden');
  });

  sendBtn.addEventListener('click', async () => {
    const userText = chatInput.value.trim();
    if (!userText) return;
    chatInput.value = '';
    addChatMessage(userText, 'user');

    setTimeout(async () => {
      const reply = await generateReplyFromFreeText(userText);
      addChatMessage(reply, 'bot');
    }, 700);
  });

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });

  function triggerMoodResponse(entry) {
    const moodName = entry.mood_name;
    const reflection = entry.reflection?.toLowerCase();

    let responses = moodResponses[moodName] || genericResponses;

    if (reflection) {
      if (reflection.includes('tired') || reflection.includes('exhaust')) {
        responses = moodResponses.Tired || responses;
      }
      if (reflection.includes('stress') || reflection.includes('pressure')) {
        responses = moodResponses.Stressed || responses;
      }
      if (reflection.includes('happy') || reflection.includes('good')) {
        responses = moodResponses.Happy || responses;
      }
    }

    const reply = responses[Math.floor(Math.random() * responses.length)];

    chatWindow.classList.remove('hidden');

    setTimeout(() => {
      addChatMessage(reply, 'bot');
    }, 500);

    const pattern = analyzeLastThreeMoods();

    if (pattern && patternResponses[pattern]) {
      const patternReply =
        patternResponses[pattern][
          Math.floor(Math.random() * patternResponses[pattern].length)
        ];

      setTimeout(() => {
        addChatMessage(patternReply, 'bot');
      }, 1600);
    }
  }
</script>
