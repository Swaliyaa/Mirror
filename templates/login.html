<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mirror - Authentication</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Homemade+Apple&amp;family=Inter:wght@300;400;600;700&amp;display=swap"
    rel="stylesheet">
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8f5f0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.01) 2px, rgba(0, 0, 0, 0.01) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0, 0, 0, 0.01) 2px, rgba(0, 0, 0, 0.01) 4px);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-y: auto;
      position: relative;
    }

    .page-title {
      font-family: 'Homemade Apple', cursive;
      font-size: 32px;
      color: #2a2a2a;
      margin: 0 0 32px 0;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.2s forwards;
      position: relative;
      z-index: 10;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .card-container {
      width: 100%;
      max-width: 440px;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.4s forwards;
      position: relative;
      z-index: 10;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid #3a3a3a;
      padding: 48px 44px;
      position: relative;
    }

    .form-heading {
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #2a2a2a;
      text-align: center;
      margin: 0 0 32px 0;
      letter-spacing: -0.3px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 400;
      color: #5a5a5a;
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 300;
      color: #2a2a2a;
      background: transparent;
      border: none;
      border-bottom: 1px solid #c0b5a0;
      outline: none;
      transition: border-color 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .form-group input::placeholder {
      color: #a09580;
    }

    .form-group input:focus {
      border-bottom-color: #3a3a3a;
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 28px 0;
      font-size: 13px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #3a3a3a;
    }

    .checkbox-wrapper label {
      font-weight: 300;
      color: #5a5a5a;
      cursor: pointer;
      margin: 0;
    }

    .forgot-link {
      color: #3a3a3a;
      text-decoration: none;
      font-weight: 300;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s ease;
      cursor: pointer;
    }

    .forgot-link:hover {
      border-bottom-color: #3a3a3a;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      font-weight: 700;
      color: #2a2a2a;
      background: transparent;
      border: 1.5px solid #3a3a3a;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      font-size: 13px;
    }

    .submit-btn:hover:not(:disabled) {
      background: rgba(58, 58, 58, 0.06);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .toggle-section {
      text-align: center;
      margin-top: 28px;
      font-size: 13px;
      font-weight: 300;
      color: #6a6a6a;
    }

    .toggle-link {
      color: #2a2a2a;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s ease;
      cursor: pointer;
      margin-left: 6px;
      font-weight: 400;
    }

    .toggle-link:hover {
      border-bottom-color: #2a2a2a;
    }

    .view {
      display: none;
      animation: fadeInContent 0.4s ease-out;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeInContent {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #3a3a3a;
      text-decoration: none;
      font-size: 13px;
      font-weight: 300;
      margin-bottom: 24px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s ease;
      cursor: pointer;
    }

    .back-link:hover {
      border-bottom-color: #3a3a3a;
    }

    .message {
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 400;
      text-align: center;
      display: none;
    }

    .message.success {
      background: rgba(76, 175, 80, 0.1);
      color: #2e7d32;
      border: 1px solid rgba(76, 175, 80, 0.3);
      display: block;
    }

    .message.error {
      background: rgba(244, 67, 54, 0.1);
      color: #c62828;
      border: 1px solid rgba(244, 67, 54, 0.3);
      display: block;
    }

    /* Journal stickers */
    .sticker {
      position: absolute;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      color: #4b463f;
      background: rgba(255, 255, 255, 0.95);
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.08),
        0 0 0 1px rgba(0, 0, 0, 0.02);
      transform: rotate(-3deg);
      white-space: nowrap;
      pointer-events: none;
      z-index: 5;
    }

    .sticker.accent {
      background: #fbe6d1;
      color: #5b4332;
      transform: rotate(4deg);
    }

    .sticker.small {
      font-size: 10px;
      padding: 5px 10px;
    }

    .sticker-top-left {
      top: 12%;
      left: 6%;
    }

    .sticker-top-right {
      top: 12%;
      right: 6%;
    }

    .sticker-bottom-left {
      bottom: 10%;
      left: 8%;
    }

    .sticker-bottom-right {
      bottom: 8%;
      right: 8%;
    }

    .sticker-mid-left {
      top: 50%;
      left: 4%;
      transform: translateY(-50%) rotate(-6deg);
    }

    .sticker-mid-right {
      top: 52%;
      right: 4%;
      transform: translateY(-50%) rotate(5deg);
    }

    @keyframes floatSoft {
      0%, 100% { transform: translateY(0) rotate(var(--rotate, 0deg)); }
      50%      { transform: translateY(-3px) rotate(var(--rotate, 0deg)); }
    }

    .sticker.float {
      animation: floatSoft 5.2s ease-in-out infinite;
    }

    /* MOBILE TWEAKS */
    @media (max-width: 480px) {
      body {
        padding: 24px 16px;
      }

      .page-title {
        font-size: 26px;
        margin-bottom: 18px;
      }

      .card-container {
        max-width: 360px;       /* slightly narrower on phones */
      }

      .card {
        padding: 28px 20px;     /* was 48px 44px */
      }

      .form-heading {
        font-size: 20px;
        margin-bottom: 20px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      .form-group label {
        font-size: 12px;
        margin-bottom: 6px;
      }

      .form-group input[type="text"],
      .form-group input[type="email"],
      .form-group input[type="password"] {
        font-size: 14px;
        padding: 10px 0;
      }

      .remember-forgot {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        margin: 16px 0 22px 0;
        font-size: 12px;
      }

      .submit-btn {
        padding: 12px;
        font-size: 12px;
      }

      .toggle-section {
        margin-top: 20px;
        font-size: 12px;
      }

      .back-link {
        font-size: 12px;
        margin-bottom: 18px;
      }

      .sticker {
        font-size: 9px;
        padding: 4px 8px;
        opacity: 0.9;
      }

      .sticker-mid-left,
      .sticker-mid-right {
        display: none;
      }

      .sticker-top-left {
        top: 6%;
        left: 4%;
      }

      .sticker-top-right {
        top: 6%;
        right: 4%;
      }

      .sticker-bottom-left {
        bottom: 6%;
        left: 4%;
      }

      .sticker-bottom-right {
        bottom: 4%;
        right: 4%;
      }
    }
  </style>
  <style>
    @view-transition {
      navigation: auto;
    }
  </style>
</head>

<body>
  <!-- Stickers around the auth card -->
  <div class="sticker sticker-top-left float" style="--rotate:-6deg;">📓 new page, same you</div>
  <div class="sticker sticker-top-right small">for your eyes only 🤍</div>
  <div class="sticker sticker-mid-left small accent" style="--rotate:-3deg;">soft start →</div>
  <div class="sticker sticker-mid-right small">tiny step, real courage</div>
  <div class="sticker sticker-bottom-left small">log in, check in</div>
  <div class="sticker sticker-bottom-right accent float" style="--rotate:5deg;">🌙 you showed up today</div>

  <h1 class="page-title" id="page-title">The Mirror</h1>
  <div class="card-container">
    <div class="card">
      <!-- Sign In View -->
      <div id="signin-view" class="view active">
        <h2 class="form-heading" id="signin-heading">Welcome back</h2>
        <form id="signin-form" method="POST" action="/login">
          <div id="signin-message" class="message"></div>
          <div class="form-group">
            <label for="signin-email">Email</label>
            <input type="email" id="signin-email"
              name="username" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="signin-password">Password</label>
            <input type="password"
              id="signin-password" name="password" placeholder="••••••••" required>
          </div>
          <div class="remember-forgot">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="remember-me">
              <label for="remember-me" id="remember-label">Remember me</label>
            </div>
            <a class="forgot-link" id="forgot-link">Forgot password?</a>
          </div>
          <button type="submit" class="submit-btn" id="signin-btn">Sign in</button>
        </form>
        <div class="toggle-section">
          <span id="no-account-text">Don't have an account?</span>
          <a class="toggle-link" id="show-signup">Sign up</a>
        </div>
      </div>

      <!-- Sign Up View -->
      <div id="signup-view" class="view">
        <h2 class="form-heading" id="signup-heading">Begin your journey</h2>
        <form id="signup-form" method="POST" action="/register">
          <div id="signup-message" class="message"></div>
          <div class="form-group">
            <label for="signup-name">Name</label>
            <input type="text" name="fullname" id="signup-name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" name="username" id="signup-email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" name="password" id="signup-password" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label for="signup-confirm">Confirm password</label>
            <input type="password" id="signup-confirm" placeholder="••••••••" required>
          </div>
          <button type="submit" class="submit-btn" id="signup-btn">Create account</button>
        </form>

        <div class="toggle-section">
          <span id="have-account-text">Already have an account?</span>
          <a class="toggle-link" id="show-signin">Sign in</a>
        </div>
      </div>

      <!-- Forgot Password View -->
      <div id="forgot-view" class="view">
        <a class="back-link" id="back-to-signin">
          <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          <span id="back-text">Back to sign in</span>
        </a>
        <h2 class="form-heading" id="forgot-heading">Reset your password</h2>
        <form id="forgot-form">
          <div id="forgot-message" class="message"></div>
          <div class="form-group">
            <label for="forgot-email">Email</label>
            <input type="email" id="forgot-email"
              placeholder="you@example.com" required>
          </div>
          <button type="submit" class="submit-btn" id="reset-btn">Send reset link</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const defaultConfig = {
      app_title: "The Mirror",
      signin_heading: "Welcome back",
      signup_heading: "Begin your journey",
      forgot_heading: "Reset your password",
      signin_button: "Sign in",
      signup_button: "Create account",
      reset_button: "Send reset link",
      remember_me_label: "Remember me",
      forgot_password_link: "Forgot password?",
      no_account_text: "Don't have an account?",
      have_account_text: "Already have an account?",
      back_to_signin: "Back to sign in",
      background_color: "#f8f5f0",
      text_color: "#2a2a2a",
      border_color: "#3a3a3a",
      input_border_color: "#c0b5a0",
      title_font_family: "Homemade Apple"
    };

    const element = {
      defaultConfig,
      onConfigChange: async (config) => {
        document.getElementById('page-title').textContent = config.app_title || defaultConfig.app_title;
        document.getElementById('signin-heading').textContent = config.signin_heading || defaultConfig.signin_heading;
        document.getElementById('signup-heading').textContent = config.signup_heading || defaultConfig.signup_heading;
        document.getElementById('forgot-heading').textContent = config.forgot_heading || defaultConfig.forgot_heading;
        document.getElementById('signin-btn').textContent = config.signin_button || defaultConfig.signin_button;
        document.getElementById('signup-btn').textContent = config.signup_button || defaultConfig.signup_button;
        document.getElementById('reset-btn').textContent = config.reset_button || defaultConfig.reset_button;
        document.getElementById('remember-label').textContent = config.remember_me_label || defaultConfig.remember_me_label;
        document.getElementById('forgot-link').textContent = config.forgot_password_link || defaultConfig.forgot_password_link;
        document.getElementById('no-account-text').textContent = config.no_account_text || defaultConfig.no_account_text;
        document.getElementById('have-account-text').textContent = config.have_account_text || defaultConfig.have_account_text;
        document.getElementById('back-text').textContent = config.back_to_signin || defaultConfig.back_to_signin;

        const titleFontStack = 'cursive';
        document.querySelector('.page-title').style.fontFamily =
          `${config.title_font_family || defaultConfig.title_font_family}, ${titleFontStack}`;

        document.body.style.backgroundColor = config.background_color || defaultConfig.background_color;

        document.querySelectorAll('.page-title, .form-heading, .submit-btn, .toggle-link, .forgot-link, .back-link, .social-btn')
          .forEach(el => {
            el.style.color = config.text_color || defaultConfig.text_color;
          });

        document.querySelectorAll('.card, .submit-btn').forEach(el => {
          el.style.borderColor = config.border_color || defaultConfig.border_color;
        });

        document.querySelectorAll('input[type="text"], input[type="email"], input[type="password"]').forEach(el => {
          el.style.borderBottomColor = config.input_border_color || defaultConfig.input_border_color;
        });
      },
      mapToCapabilities: (config) => ({
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => {
              config.background_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => config.border_color || defaultConfig.border_color,
            set: (value) => {
              config.border_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ border_color: value });
            }
          },
          {
            get: () => config.input_border_color || defaultConfig.input_border_color,
            set: (value) => {
              config.input_border_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ input_border_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.title_font_family || defaultConfig.title_font_family,
          set: (value) => {
            config.title_font_family = value;
            if (window.elementSdk) window.elementSdk.setConfig({ title_font_family: value });
          }
        },
        fontSizeable: undefined
      }),
      mapToEditPanelValues: (config) => new Map([
        ["app_title", config.app_title || defaultConfig.app_title],
        ["signin_heading", config.signin_heading || defaultConfig.signin_heading],
        ["signup_heading", config.signup_heading || defaultConfig.signup_heading],
        ["forgot_heading", config.forgot_heading || defaultConfig.forgot_heading],
        ["signin_button", config.signin_button || defaultConfig.signin_button],
        ["signup_button", config.signup_button || defaultConfig.signup_button],
        ["reset_button", config.reset_button || defaultConfig.reset_button],
        ["remember_me_label", config.remember_me_label || defaultConfig.remember_me_label],
        ["forgot_password_link", config.forgot_password_link || defaultConfig.forgot_password_link],
        ["no_account_text", config.no_account_text || defaultConfig.no_account_text],
        ["have_account_text", config.have_account_text || defaultConfig.have_account_text],
        ["back_to_signin", config.back_to_signin || defaultConfig.back_to_signin]
      ])
    };

    if (window.elementSdk) {
      window.elementSdk.init(element);
    }

    const views = {
      signin: document.getElementById('signin-view'),
      signup: document.getElementById('signup-view'),
      forgot: document.getElementById('forgot-view')
    };

    function showView(viewName) {
      Object.values(views).forEach(view => view.classList.remove('active'));
      views[viewName].classList.add('active');
    }

    document.getElementById('show-signup').addEventListener('click', e => {
      e.preventDefault();
      showView('signup');
      history.pushState(null, 'Sign Up', '/register');
    });

    document.getElementById('show-signin').addEventListener('click', e => {
      e.preventDefault();
      showView('signin');
      history.pushState(null, 'Sign In', '/login');
    });

    document.getElementById('forgot-link').addEventListener('click', e => {
      e.preventDefault();
      showView('forgot');
    });

    document.getElementById('back-to-signin').addEventListener('click', e => {
      e.preventDefault();
      showView('signin');
    });

    function showMessage(elementId, text, type) {
      const message = document.getElementById(elementId);
      if (!message) return;
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function hideMessage(elementId) {
      const message = document.getElementById(elementId);
      if (!message) return;
      message.className = 'message';
    }

    document.getElementById('signin-form').addEventListener('submit', async e => {
      const button = document.getElementById('signin-btn');
      button.textContent = 'Signing in...';
    });

    document.getElementById('signup-form').addEventListener('submit', async e => {
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;

      if (password !== confirm) {
        e.preventDefault();
        showMessage('signup-message', 'Passwords do not match', 'error');
        return;
      }

      const button = document.getElementById('signup-btn');
      button.textContent = 'Creating account...';
    });

    document.getElementById('forgot-form').addEventListener('submit', async e => {
      e.preventDefault();
      const button = document.getElementById('reset-btn');
      const config = window.elementSdk?.config || defaultConfig;
      const originalText = config.reset_button || defaultConfig.reset_button;

      button.textContent = 'Sending...';
      button.disabled = true;

      await new Promise(resolve => setTimeout(resolve, 1500));

      showMessage('forgot-message', 'Password reset link sent! Check your email.', 'success');

      setTimeout(() => {
        button.textContent = originalText;
        button.disabled = false;
        document.getElementById('forgot-form').reset();
        hideMessage('forgot-message');
      }, 2000);
    });
  </script>

</body>

</html>
