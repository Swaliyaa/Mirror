  <style>
    body {
      box-sizing: border-box;
    }
    
    .handwritten {
      font-family: 'Homemade Apple', cursive;
    }
    
    .body-text {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }
    
    .paper-texture {
      background-color: #faf9f7;
      background-image: 
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,0.01) 2px,
          rgba(0,0,0,0.01) 4px
        );
    }
    
    .habit-checkbox {
      width: 28px;
      height: 28px;
      border: 2px solid #3a3a3a;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    
    .habit-checkbox.completed {
      background-color: #3a3a3a;
      position: relative;
    }
    
    .habit-checkbox.completed::after {
      content: '✓';
      color: #faf9f7;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
    }
    
    .habit-row {
      transition: opacity 0.2s ease;
    }
    
    .habit-row.completed {
      opacity: 0.5;
    }
    
    .habit-row.completed .habit-name {
      text-decoration: line-through;
    }
    
    .delete-btn {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    
    .habit-row:hover .delete-btn {
      opacity: 1;
    }
    
    .progress-bar {
      height: 4px;
      background-color: #e5e5e5;
      border-radius: 2px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background-color: #3a3a3a;
      transition: width 0.3s ease;
    }
    
    .circular-progress {
      width: 80px;
      height: 80px;
      position: relative;
    }
    
    .circular-progress svg {
      transform: rotate(-90deg);
    }
    
    .circular-progress-ring {
      fill: none;
      stroke: #e5e5e5;
      stroke-width: 6;
    }
    
    .circular-progress-fill {
      fill: none;
      stroke: #3a3a3a;
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s ease;
    }
    
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.3);
      z-index: 50;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal-content {
      background-color: #faf9f7;
      border: 1px solid #d5d5d5;
      border-radius: 12px;
      max-width: 420px;
      width: 90%;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d5d5d5;
      border-radius: 8px;
      background-color: #faf9f7;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 15px;
      color: #3a3a3a;
      transition: border-color 0.2s ease;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #3a3a3a;
    }
    
    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    
    .btn-primary {
      background-color: #3a3a3a;
      color: #faf9f7;
    }
    
    .btn-primary:hover {
      background-color: #2a2a2a;
    }
    
    .btn-secondary {
      background-color: transparent;
      color: #6a6a6a;
      border: 1px solid #d5d5d5;
    }
    
    .btn-secondary:hover {
      background-color: #f0f0f0;
    }
    
    .icon-select {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    
    .icon-option {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #d5d5d5;
      border-radius: 8px;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.2s ease;
    }
    
    .icon-option:hover {
      border-color: #3a3a3a;
    }
    
    .icon-option.selected {
      border-color: #3a3a3a;
      background-color: #f0f0f0;
    }
    
    .loading-spinner {
      border: 2px solid #e5e5e5;
      border-top-color: #3a3a3a;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.6s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    const defaultConfig = {
      page_title: 'Habits',
      page_subtitle: 'showing up, one day at a time',
      today_section_title: "Today's Habits",
      progress_title: "Today's Progress",
      weekly_title: 'Weekly Overview',
      streaks_title: 'Current Streaks',
      insights_title: 'Insights'
    };

    let habits = [];
    let selectedIcon = '🌱';

    // Helper: Get today's date string (YYYY-MM-DD)
    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }

    // Helper: Parse completion history from JSON string
    function parseCompletionHistory(history) {
  if (!history) return {};

  if (typeof history === 'object') return history;  // ✅ Fixed: semicolon after return

  try {
    const parsed = JSON.parse(history);
    return typeof parsed === 'object' ? parsed : {};
  } catch {
    return {};
  }
}



    // Helper: Check if habit is completed today
    function isCompletedToday(habit) {
      const history = parseCompletionHistory(habit.completion_history);
      return history[getTodayString()] === true;
    }

    // Helper: Calculate streak from completion history
    function calculateStreak(habit) {
      const history = parseCompletionHistory(habit.completion_history);
      const dates = Object.keys(history).filter(date => history[date]).sort().reverse();
      
      if (dates.length === 0) return 0;

      const today = getTodayString();
      let streak = 0;
      let currentDate = new Date();

      // Start from today or most recent completion
      if (history[today]) {
        streak = 1;
        currentDate.setDate(currentDate.getDate() - 1);
      } else {
        // If not completed today, check if most recent is yesterday
        const mostRecent = dates[0];
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayString = yesterday.toISOString().split('T')[0];
        
        if (mostRecent !== yesterdayString) {
          return 0; // Streak broken
        }
        
        streak = 1;
        currentDate = yesterday;
        currentDate.setDate(currentDate.getDate() - 1);
      }

      // Count consecutive days backwards
      while (true) {
        const dateString = currentDate.toISOString().split('T')[0];
        if (history[dateString]) {
          streak++;
          currentDate.setDate(currentDate.getDate() - 1);
        } else {
          break;
        }
      }

      return streak;
    }

    // Helper: Get last 7 days as array of date strings
    function getLast7Days() {
      const days = [];
      for (let i = 0; i < 7; i++) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        days.push(date.toISOString().split('T')[0]);
      }
      return days;
    }

    // Helper: Calculate weekly completion rate
    function calculateWeeklyRate(habits) {
      if (habits.length === 0) return 0;

      const last7Days = getLast7Days();
      let totalPossible = 0;
      let totalCompleted = 0;

      habits.forEach(habit => {
        const history = parseCompletionHistory(habit.completion_history);
        last7Days.forEach(day => {
          totalPossible++;
          if (history[day]) {
            totalCompleted++;
          }
        });
      });

      return totalPossible > 0 ? Math.round((totalCompleted / totalPossible) * 100) : 0;
    }

    // Helper: Calculate completion rate for a habit
    function calculateCompletionRate(habit) {
      const history = parseCompletionHistory(habit.completion_history);
      const dates = Object.keys(history);
      if (dates.length === 0) return 0;
      
      const completedDays = dates.filter(date => history[date]).length;
      return Math.round((completedDays / dates.length) * 100);
    }

    // Initialize SDKs
    async function loadHabits() {
  const res = await fetch("/api/habits");
  habits = await res.json();
  renderHabits();
  updateProgress();
  updateWeeklyOverview();
  updateStreaks();
  updateInsights();
}

      if (!dataResult.isOk) {
        console.error('Failed to initialize data SDK');
      }

      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange: async (config) => {
            document.getElementById('page-title').textContent = config.page_title || defaultConfig.page_title;
            document.getElementById('page-subtitle').textContent = config.page_subtitle || defaultConfig.page_subtitle;
            document.getElementById('today-section-title').textContent = config.today_section_title || defaultConfig.today_section_title;
            document.getElementById('progress-title').textContent = config.progress_title || defaultConfig.progress_title;
            document.getElementById('weekly-title').textContent = config.weekly_title || defaultConfig.weekly_title;
            document.getElementById('streaks-title').textContent = config.streaks_title || defaultConfig.streaks_title;
            document.getElementById('insights-title').textContent = config.insights_title || defaultConfig.insights_title;
          },
          mapToCapabilities: (config) => ({
            recolorables: [],
            borderables: [],
            fontEditable: undefined,
            fontSizeable: undefined
          }),
          mapToEditPanelValues: (config) => new Map([
            ['page_title', config.page_title || defaultConfig.page_title],
            ['page_subtitle', config.page_subtitle || defaultConfig.page_subtitle],
            ['today_section_title', config.today_section_title || defaultConfig.today_section_title],
            ['progress_title', config.progress_title || defaultConfig.progress_title],
            ['weekly_title', config.weekly_title || defaultConfig.weekly_title],
            ['streaks_title', config.streaks_title || defaultConfig.streaks_title],
            ['insights_title', config.insights_title || defaultConfig.insights_title]
          ])
        });
      }
    

    // Update date display
    function updateDateDisplay() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', options);
    }

    // Render habits
    function renderHabits() {
      const container = document.getElementById('habits-container');
      
      if (habits.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-500 italic text-center py-8">No habits yet. Add your first one below.</p>';
        return;
      }

      // Build a map of existing elements
      const existingElements = new Map();
      container.querySelectorAll('.habit-row').forEach(el => {
        existingElements.set(el.dataset.id, el);
      });

      // Update or create elements
      habits.forEach(habit => {
        const completedToday = isCompletedToday(habit);
        const streak = calculateStreak(habit);
        const completionRate = calculateCompletionRate(habit);
        
        const existingEl = existingElements.get(habit.id);
        
        if (existingEl) {
          // Update existing element
          const checkbox = existingEl.querySelector('.habit-checkbox');
          const row = existingEl;
          const streakText = existingEl.querySelector('.text-xs');
          
          if (completedToday) {
            checkbox.classList.add('completed');
            row.classList.add('completed');
          } else {
            checkbox.classList.remove('completed');
            row.classList.remove('completed');
          }
          
          streakText.textContent = `${streak > 0 ? `${streak}-day streak` : 'No streak yet'} · ${completionRate}% completion`;
          
          existingElements.delete(habit.id);
        } else {
          // Create new element
          const habitEl = document.createElement('div');
          habitEl.className = `habit-row ${completedToday ? 'completed' : ''} flex items-center gap-4 py-3 px-4 rounded-lg hover:bg-gray-50 transition-colors`;
          habitEl.dataset.id = habit.id;
          habitEl.innerHTML = `
            <div class="habit-checkbox ${completedToday ? 'completed' : ''}" onclick="toggleHabit('${habit.id}')"></div>
            <span class="text-2xl flex-shrink-0">${habit.icon}</span>
            <div class="flex-1 min-w-0">
              <p class="habit-name text-base text-gray-900">${habit.name}</p>
              <p class="text-xs text-gray-500 mt-1">
                ${streak > 0 ? `${streak}-day streak` : 'No streak yet'} · ${completionRate}% completion
              </p>
            </div>
            <button class="delete-btn text-gray-400 hover:text-gray-700 transition-colors" onclick="deleteHabit('${habit.id}')" aria-label="Delete habit">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
              </svg>
            </button>
          `;
          container.appendChild(habitEl);
        }
      });

      // Remove deleted habits
      existingElements.forEach(el => el.remove());
    }

    // Toggle habit completion
    async function toggleHabit(id) {
      const habit = habits.find(h => h.id === id);
      if (!habit) return;

      const today = getTodayString();
      const history = parseCompletionHistory(habit.completion_history);
      const wasCompletedToday = history[today] === true;
      
      // Optimistic UI update
      const habitRow = document.querySelector(`[data-id="${id}"]`);
      const checkbox = habitRow.querySelector('.habit-checkbox');
      
      if (wasCompletedToday) {
        checkbox.classList.remove('completed');
        habitRow.classList.remove('completed');
      } else {
        checkbox.classList.add('completed');
        habitRow.classList.add('completed');
      }
      
      
const result = await fetch(`/api/habits/${id}`, {
  method: 'PUT',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({
    completed: !wasCompletedToday
  })
});

if (!result.ok) {
  console.error('Failed to update habit');

  // Revert optimistic UI if backend fails
  if (wasCompletedToday) {
    checkbox.classList.add('completed');
    habitRow.classList.add('completed');
  } else {
    checkbox.classList.remove('completed');
    habitRow.classList.remove('completed');
  }
}



      // Update analytics immediately
      updateProgress();
      updateWeeklyOverview();
      updateStreaks();
      updateInsights();

}

    // Delete habit
    async function deleteHabit(id) {
      const habitRow = document.querySelector(`[data-id="${id}"]`);
      const deleteBtn = habitRow.querySelector('.delete-btn');
      
      // Two-step delete confirmation
      if (!deleteBtn.classList.contains('confirm-delete')) {
        deleteBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        `;
        deleteBtn.classList.add('confirm-delete', 'text-red-500', 'hover:text-red-700');
        
        setTimeout(() => {
          deleteBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          `;
          deleteBtn.classList.remove('confirm-delete', 'text-red-500', 'hover:text-red-700');
        }, 3000);
        return;
      }

      const habit = habits.find(h => h.id === id);
      if (!habit) return;

      const result = await fetch(`/api/habits/${id}`, {

      const percentage = total > 0 ? (completed / total) * 100 : 0;

      document.getElementById('progress-emoji').textContent = emoji;

    function updateWeeklyOverview() {

      document.getElementById('weekly-percentage').textContent = `${weeklyRate}%`;

      const circumference = 276.46;
      const offset = circumference - (weeklyRate / 100) * circumference;
      document.getElementById('weekly-progress-fill').style.strokeDashoffset = offset;

      // Update comparison text
      const comparisonText = weeklyRate >= 80 ? 'Excellent consistency' :

        .sort((a, b) => b.currentStreak - a.currentStreak)

function addChatMessage(text, sender = 'bot') {
