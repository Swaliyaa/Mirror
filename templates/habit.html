<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mirror - Habit Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body { box-sizing: border-box; }
    .handwritten { font-family: 'Homemade Apple', cursive; }
    .body-text { font-family: 'Inter', sans-serif; font-weight: 300; }
    .paper-texture { background-color: #faf9f7; }
    .habit-checkbox {
      width: 28px; height: 28px; border: 2px solid #3a3a3a;
      border-radius: 50%; cursor: pointer;
    }
    .habit-checkbox.completed {
      background-color: #3a3a3a; position: relative;
    }
    .habit-checkbox.completed::after {
      content: '✓'; color: #faf9f7;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .habit-row.completed { opacity: .5; }
    .habit-row.completed .habit-name { text-decoration: line-through; }
    .delete-btn { opacity: 0; }
    .habit-row:hover .delete-btn { opacity: 1; }
  </style>
</head>

<body class="h-full body-text">

<!-- CHATBOT -->
<div id="habit-chatbot" class="fixed bottom-5 right-5 z-50">
  <button id="chat-toggle" class="w-14 h-14 rounded-full bg-[#3d3a37] text-white text-xl shadow-lg">💬</button>
  <div id="chat-window" class="hidden w-72 h-96 bg-[#faf8f5] border rounded-xl shadow-xl flex flex-col">
    <div class="p-3 border-b text-sm font-semibold">Mirror Companion</div>
    <div id="chat-messages" class="flex-1 p-3 space-y-2 text-sm overflow-y-auto"></div>
  </div>
</div>

<div class="paper-texture min-h-full w-full p-6">
  <h1 class="handwritten text-4xl mb-4">Habits</h1>

  <div id="habits-container" class="space-y-3"></div>

  <button id="add-habit-btn"
    class="mt-6 w-full py-3 border border-dashed rounded-lg text-sm">
    + Add New Habit
  </button>
</div>

<script>
let habits = [];
let selectedIcon = "🌱";

function getToday() {
  return new Date().toISOString().split("T")[0];
}

function parseHistory(history) {
  if (!history) return {};
  if (typeof history === "object") return history;
  try { return JSON.parse(history); }
  catch { return {}; }
}

async function loadHabits() {
  const res = await fetch("/api/habits");
  habits = await res.json();
  renderHabits();
}

function renderHabits() {
  const container = document.getElementById("habits-container");
  container.innerHTML = "";

  if (habits.length === 0) {
    container.innerHTML = `<p class="italic text-sm text-gray-500">No habits yet</p>`;
    return;
  }

  habits.forEach(habit => {
    const history = parseHistory(habit.completion_history);
    const completedToday = history[getToday()] === true;

    const row = document.createElement("div");
    row.className = `habit-row flex items-center gap-4 p-3 rounded ${completedToday ? "completed" : ""}`;
    row.dataset.id = habit.id;

    row.innerHTML = `
      <div class="habit-checkbox ${completedToday ? "completed" : ""}"></div>
      <span class="text-xl">${habit.icon}</span>
      <span class="habit-name flex-1">${habit.name}</span>
      <button class="delete-btn">❌</button>
    `;

    // ✅ ALWAYS attach listeners
    row.querySelector(".habit-checkbox")
      .addEventListener("click", () => toggleHabit(habit.id));

    row.querySelector(".delete-btn")
      .addEventListener("click", () => deleteHabit(habit.id));

    container.appendChild(row);
  });
}

async function toggleHabit(id) {
  const habit = habits.find(h => h.id === id);
  if (!habit) return;

  const history = parseHistory(habit.completion_history);
  const today = getToday();
  const wasDone = history[today] === true;

  await fetch(`/api/habits/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ completed: !wasDone })
  });

  triggerHabitResponse({ wasCompletedToday: wasDone });
  loadHabits();
}

async function deleteHabit(id) {
  await fetch(`/api/habits/${id}`, { method: "DELETE" });
  loadHabits();
}

/* CHATBOT */
const chatToggle = document.getElementById("chat-toggle");
const chatWindow = document.getElementById("chat-window");
const chatMessages = document.getElementById("chat-messages");

chatToggle.onclick = () => chatWindow.classList.toggle("hidden");

function triggerHabitResponse({ wasCompletedToday }) {
  const messages = wasCompletedToday
    ? ["You can always come back 🤍"]
    : ["Allah loves consistency, even if small 🌱"];

  const msg = document.createElement("div");
  msg.className = "bg-gray-200 p-2 rounded";
  msg.textContent = messages[Math.floor(Math.random() * messages.length)];

  chatMessages.appendChild(msg);
  chatWindow.classList.remove("hidden");
}

loadHabits();
</script>

</body>
</html>
