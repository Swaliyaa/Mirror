<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirror</title>
  <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap" rel="stylesheet">
  <style>
    /* Reset & basic styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body {
      background: linear-gradient(135deg, #faf8f5 0%, #f5f1ea 100%);
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.01) 2px, rgba(0,0,0,0.01) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.01) 2px, rgba(0,0,0,0.01) 4px);
      pointer-events: none;
    }

    /* Main container flex */
    .container {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative; /* for stickers */
      z-index: 1;
    }

    /* Text wrapper centers letters perfectly */
    .text-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2; /* above stickers */
    }

    /* Handwriting text */
    .animated-text {
      font-family: 'Homemade Apple', cursive;
      font-size: 72px;
      font-weight: 400;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      white-space: nowrap;
      position: relative;
    }

    /* Letters wrapper ensures perfect centering */
    .letters-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Base letter style; animation attached via JS */
    .animated-text span {
      display: inline-block;
      opacity: 0;
    }

    @keyframes writeIn {
      0% { opacity: 0; transform: translateX(-5px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* Journal sticker vibes */
    .sticker {
      position: absolute;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      color: #4b463f;
      background: rgba(255, 255, 255, 0.85);
      box-shadow:
        0 8px 18px rgba(0,0,0,0.08),
        0 0 0 1px rgba(0,0,0,0.02);
      transform: rotate(-3deg);
      pointer-events: none;
      z-index: 1;
    }
    .sticker.small {
      padding: 6px 10px;
      font-size: 11px;
    }
    .sticker.accent {
      background: #fbe6d1;
      color: #5b4332;
      transform: rotate(4deg);
    }

    /* Positions around center (responsive-ish using percentages) */
    .sticker-top-left {
      top: 10%;
      left: 8%;
    }
    .sticker-top-right {
      top: 12%;
      right: 8%;
    }
    .sticker-bottom-left {
      bottom: 12%;
      left: 10%;
    }
    .sticker-bottom-right {
      bottom: 10%;
      right: 10%;
    }
    .sticker-side-left {
      top: 50%;
      left: 5%;
      transform: translateY(-50%) rotate(-6deg);
    }
    .sticker-side-right {
      top: 55%;
      right: 6%;
      transform: translateY(-50%) rotate(5deg);
    }

    /* Slight floating animation */
    @keyframes floatSoft {
      0%,100% { transform: translateY(0) rotate(var(--rotate, 0deg)); }
      50% { transform: translateY(-4px) rotate(var(--rotate, 0deg)); }
    }
    .sticker.float {
      animation: floatSoft 5s ease-in-out infinite;
    }
    .doodle-heart {
      position: absolute;
      font-size: 13px;
      color: #e19aa5;
      opacity: 0.95;
      pointer-events: none;
      z-index: 2;
    }
    /* Make stickers less intense on very small screens */
    @media (max-width: 480px) {
      .animated-text {
        font-size: 48px;
      }
      .sticker {
        font-size: 10px;
        padding: 5px 9px;
        opacity: 0.85;
      }
      .sticker-top-left,
      .sticker-bottom-left {
        left: 4%;
      }
      .sticker-top-right,
      .sticker-bottom-right {
        right: 4%;
      }
      .sticker-side-left,
      .sticker-side-right {
        display: none; /* keep center text super clean on tiny screens */
      }
    }
  </style>
</head>
<body>
  <!-- Stickers around the main word -->
  <div class="sticker sticker-top-left float" style="--rotate:-5deg;">⭐ little check‑in</div>
  <div class="sticker sticker-top-right small">today’s page →</div>
  <div class="sticker sticker-bottom-left accent float" style="--rotate:3deg;">📓 gentle space</div>
  <div class="sticker sticker-bottom-right small">breathe in, breathe out</div>
  <div class="sticker sticker-side-left small">🕊 soft start</div>
  <div class="sticker sticker-side-right small accent">for your eyes only 🤍</div>

  <div class="doodle-heart" style="top: 8%; left: 14%;">❤</div>
  <div class="doodle-heart" style="top: 6%; right: 12%;">❤</div>

  <div class="doodle-heart" style="top: 32%; left: 6%;">❤</div>
  <div class="doodle-heart" style="top: 30%; right: 5%;">❤</div>

  <div class="doodle-heart" style="bottom: 30%; left: 8%;">❤</div>
  <div class="doodle-heart" style="bottom: 28%; right: 9%;">❤</div>

  <div class="doodle-heart" style="bottom: 10%; left: 12%;">❤</div>
  <div class="doodle-heart" style="bottom: 8%; right: 14%;">❤</div>
  <div class="container">
    <div class="text-wrapper">
      <div class="animated-text" id="animatedText">
        <div class="letters-wrapper" id="lettersWrapper"></div>
      </div>
    </div>
  </div>

  <script>
    const defaultConfig = { display_text: 'mirror' };
    let config = { ...defaultConfig };

    function renderText(textContent) {
      const lettersWrapper = document.getElementById('lettersWrapper');
      lettersWrapper.innerHTML = '';

      const text = textContent.toLowerCase();
      const baseDelay = 0.3; // seconds between letters
      const animDuration = 0.3; // each letter's animation duration (matches CSS)

      for (let i = 0; i < text.length; i++) {
        const span = document.createElement('span');
        span.textContent = text[i];

        // apply animation via inline style so it only starts after DOM is ready
        span.style.animation = `writeIn ${animDuration}s ease-out forwards`;
        span.style.animationDelay = `${i * baseDelay}s`;

        lettersWrapper.appendChild(span);
      }

      // auto-redirect after last letter finishes + extra delay
      if (text.length > 0) {
        const totalTime = (text.length - 1) * baseDelay + animDuration;

        // safety: use setTimeout instead of relying on animationend vendor variations
        setTimeout(() => {
          // small extra pause (1s) to let them "see" the full word
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1000);
        }, totalTime * 1000);
      }
    }

    async function onConfigChange(newConfig) {
      config = { ...config, ...newConfig };
      const textToDisplay = config.display_text || defaultConfig.display_text;
      renderText(textToDisplay);
    }

    // Initial render on first load
    renderText(defaultConfig.display_text);
  </script>
</body>
</html>
