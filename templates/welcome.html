<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handwritten Text Animation</title>
  <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap" rel="stylesheet">
  <style>
    /* Reset & basic styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body {
      background: linear-gradient(135deg, #faf8f5 0%, #f5f1ea 100%);
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.01) 2px, rgba(0,0,0,0.01) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.01) 2px, rgba(0,0,0,0.01) 4px);
      pointer-events: none;
    }

    /* Main container flex */
    .container {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Text wrapper centers letters perfectly */
    .text-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Handwriting text */
    .animated-text {
      font-family: 'Homemade Apple', cursive;
      font-size: 72px;
      font-weight: 400;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      white-space: nowrap;
      position: relative;
    }

    /* Letters wrapper ensures perfect centering */
    .letters-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Base letter style; animation attached via JS */
    .animated-text span {
      display: inline-block;
      opacity: 0;
    }

    @keyframes writeIn {
      0% { opacity: 0; transform: translateX(-5px); }
      100% { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-wrapper">
      <div class="animated-text" id="animatedText">
        <div class="letters-wrapper" id="lettersWrapper"></div>
      </div>
    </div>
  </div>

  <script>
    const defaultConfig = { display_text: 'mirror' };
    let config = { ...defaultConfig };

    function renderText(textContent) {
      const lettersWrapper = document.getElementById('lettersWrapper');
      lettersWrapper.innerHTML = '';

      const text = textContent.toLowerCase();
      const baseDelay = 0.3; // seconds between letters
      const animDuration = 0.3; // each letter's animation duration (matches CSS)

      for (let i = 0; i < text.length; i++) {
        const span = document.createElement('span');
        span.textContent = text[i];

        // apply animation via inline style so it only starts after DOM is ready
        span.style.animation = `writeIn ${animDuration}s ease-out forwards`;
        span.style.animationDelay = `${i * baseDelay}s`;

        lettersWrapper.appendChild(span);
      }

      // auto-redirect after last letter finishes + extra delay
      if (text.length > 0) {
        const lastSpan = lettersWrapper.lastElementChild;
        const totalTime = (text.length - 1) * baseDelay + animDuration;

        // safety: use setTimeout instead of relying on animationend vendor variations
        setTimeout(() => {
          // small extra pause (1s) to let them "see" the full word
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1000);
        }, totalTime * 1000);
      }
    }

    async function onConfigChange(newConfig) {
      config = { ...config, ...newConfig };
      const textToDisplay = config.display_text || defaultConfig.display_text;
      renderText(textToDisplay);
    }

    // Initial render on first load
    renderText(defaultConfig.display_text);
  </script>
</body>
</html>
