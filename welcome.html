<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handwritten Text Animation</title>
  <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap" rel="stylesheet">
  <style>
    /* Reset & basic styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body {
      background: linear-gradient(135deg, #faf8f5 0%, #f5f1ea 100%);
      overflow: hidden;
      cursor: pointer; /* shows it's clickable */
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.01) 2px, rgba(0,0,0,0.01) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.01) 2px, rgba(0,0,0,0.01) 4px);
      pointer-events: none;
    }

    /* Main container flex */
    .container {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Text wrapper centers letters perfectly */
    .text-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Handwriting text */
    .animated-text {
      font-family: 'Homemade Apple', cursive;
      font-size: 72px;
      font-weight: 400;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      white-space: nowrap;
      position: relative;
    }

    /* Letters wrapper ensures perfect centering */
    .letters-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Individual letter animation */
    .animated-text span {
      display: inline-block;
      opacity: 0;
      animation: writeIn 0.3s ease-out forwards;
    }
    .animated-text span:nth-child(1) { animation-delay: 0s; }
    .animated-text span:nth-child(2) { animation-delay: 0.3s; }
    .animated-text span:nth-child(3) { animation-delay: 0.6s; }
    .animated-text span:nth-child(4) { animation-delay: 0.9s; }
    .animated-text span:nth-child(5) { animation-delay: 1.2s; }
    .animated-text span:nth-child(6) { animation-delay: 1.5s; }

    @keyframes writeIn {
      0% { opacity: 0; transform: translateX(-5px); }
      100% { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body onclick="window.location.href='login.html'">
  <div class="container">
    <div class="text-wrapper">
      <div class="animated-text" id="animatedText">
        <div class="letters-wrapper" id="lettersWrapper"></div>
      </div>
    </div>
  </div>

  <script>
    const defaultConfig = { display_text: 'mirror' };
    let config = { ...defaultConfig };

    function renderText(textContent) {
      const lettersWrapper = document.getElementById('lettersWrapper');
      lettersWrapper.innerHTML = '';
      const text = textContent.toLowerCase();
      for (let i = 0; i < text.length; i++) {
        const span = document.createElement('span');
        span.textContent = text[i];
        lettersWrapper.appendChild(span);
      }
    }

    async function onConfigChange(newConfig) {
      config = { ...config, ...newConfig };
      const textToDisplay = config.display_text || defaultConfig.display_text;
      renderText(textToDisplay);
    }

    renderText(defaultConfig.display_text);
  </script>
</body>
</html>
