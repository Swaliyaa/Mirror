<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mirror - To-Do</title>
 
  <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&amp;family=Inter:wght@300;400;500&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    
    .paper-bg {
      background-color: #faf8f3;
      background-image: 
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(230, 220, 200, 0.06) 2px,
          rgba(230, 220, 200, 0.06) 4px
        );
    }
    
    .handwritten {
      font-family: 'Homemade Apple', cursive;
      letter-spacing: 0.3px;
    }
    
    .body-text {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }
    
    .journal-card {
      background: rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
    
    .task-row {
      transition: all 0.3s ease;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(0, 0, 0, 0.04);
    }
    
    .task-row.completed {
      opacity: 0.4;
      background: rgba(0, 0, 0, 0.02);
    }
    
    .task-text.completed {
      text-decoration: line-through;
      text-decoration-color: rgba(0, 0, 0, 0.3);
    }
    
    input[type="text"],
    input[type="date"],
    select,
    textarea {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
    }
    
    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(0, 0, 0, 0.2);
      background: rgba(255, 255, 255, 0.7);
    }
    
    .btn-soft {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    
    .btn-soft:hover:not(:disabled) {
      background: rgba(0, 0, 0, 0.08);
      border-color: rgba(0, 0, 0, 0.12);
    }
    
    .btn-soft:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    
    .btn-primary {
      background: rgba(0, 0, 0, 0.85);
      color: #faf8f3;
      border: none;
    }
    
    .btn-primary:hover:not(:disabled) {
      background: rgba(0, 0, 0, 0.95);
    }
    
    .checkbox {
      width: 20px;
      height: 20px;
      border: 1.5px solid rgba(0, 0, 0, 0.25);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .checkbox:hover {
      border-color: rgba(0, 0, 0, 0.4);
      background: rgba(0, 0, 0, 0.02);
    }
    
    .filter-btn {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 0.875rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
      color: rgba(0, 0, 0, 0.5);
    }
    
    .filter-btn:hover {
      opacity: 0.7;
    }
    
    .filter-btn.active {
      font-weight: 400;
      color: rgba(0, 0, 0, 0.9);
    }
    
    .category-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.05);
      color: rgba(0, 0, 0, 0.6);
    }
    
    .priority-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    
    .priority-low { background: rgba(0, 0, 0, 0.2); }
    .priority-medium { background: rgba(0, 0, 0, 0.4); }
    .priority-high { background: rgba(0, 0, 0, 0.7); }
    
    .progress-bar-bg {
      height: 4px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    
    .progress-bar-fill {
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      transition: width 0.5s ease;
      border-radius: 2px;
    }
    
    .stat-card {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 16px;
    }
    
    .back-arrow {
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    
    .back-arrow:hover {
      opacity: 0.6;
    }
    
    .delete-btn {
      opacity: 0;
      transition: opacity 0.2s ease;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.3);
      font-size: 1.2rem;
      padding: 4px 8px;
    }
    
    .task-row:hover .delete-btn {
      opacity: 1;
    }
    
    .delete-btn:hover {
      color: rgba(0, 0, 0, 0.6);
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: #faf8f3;
      padding: 12px 24px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      z-index: 1000;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .due-label {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 400;
    }
    
    .due-today {
      background: rgba(0, 0, 0, 0.08);
      color: rgba(0, 0, 0, 0.7);
    }
    
    .due-overdue {
      background: rgba(0, 0, 0, 0.12);
      color: rgba(0, 0, 0, 0.8);
    }
    
    .due-future {
      background: rgba(0, 0, 0, 0.04);
      color: rgba(0, 0, 0, 0.5);
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
 </head>
 <!-- Chatbot -->
<div id="mood-chatbot" class="fixed bottom-5 right-5 z-50">
  <button id="chat-toggle" class="w-14 h-14 rounded-full bg-[#3d3a37] text-white text-xl shadow-lg">
    💬
  </button>

  <div id="chat-window" class="hidden w-72 h-96 bg-[#faf8f5] border border-ink rounded-xl shadow-xl flex flex-col overflow-hidden">
    <div class="p-3 border-b border-ink text-sm ink-text font-semibold">
      Mirror Companion
    </div>

    <div id="chat-messages" class="flex-1 p-3 space-y-2 text-sm overflow-y-auto"></div>
  </div>
</div>

 <body class="h-full body-text">
  <div class="paper-bg w-full h-full overflow-auto">
   <div class="w-full px-12 py-10"><!-- Header -->
    <div class="mb-8">
     <div class="flex items-center gap-4 mb-2">
      <div class="back-arrow text-2xl" style="color: rgba(0,0,0,0.4);">
       ←
      </div>
      <h1 id="page-title" class="handwritten text-3xl" style="color: #000;">To-Do</h1>
     </div>
     <p id="page-subtitle" class="text-sm ml-12" style="color: rgba(0,0,0,0.4); font-style: italic;">checking in with today</p>
     <p class="text-xs ml-12 mt-1" style="color: rgba(0,0,0,0.3);" id="current-date"></p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6"><!-- Main Content -->
     <div class="lg:col-span-2 space-y-6"><!-- Add Task Card -->
      <div class="journal-card p-6">
       <h3 class="text-sm font-normal mb-4" style="color: rgba(0,0,0,0.6);">New Task</h3><textarea id="task-input" placeholder="What would you like to accomplish?" class="w-full px-3 py-2 text-sm mb-4 resize-none" rows="2" style="color: #000;"></textarea>
       <div class="grid grid-cols-2 gap-3 mb-4">
        <div><label class="block text-xs mb-1" style="color: rgba(0,0,0,0.5);">Category</label> <select id="category-select" class="w-full px-3 py-2 text-sm" style="color: #000;"> <option value="">None</option> <option value="work">Work</option> <option value="personal">Personal</option> <option value="health">Health</option> <option value="shopping">Shopping</option> <option value="other">Other</option> </select>
        </div>
        <div><label class="block text-xs mb-1" style="color: rgba(0,0,0,0.5);">Priority</label> <select id="priority-select" class="w-full px-3 py-2 text-sm" style="color: #000;"> <option value="">None</option> <option value="low">Low</option> <option value="medium">Medium</option> <option value="high">High</option> </select>
        </div>
       </div>
       <div class="mb-4"><label class="block text-xs mb-1" style="color: rgba(0,0,0,0.5);">Due Date (optional)</label> <input type="date" id="due-date-input" class="w-full px-3 py-2 text-sm" style="color: #000;">
       </div><button id="add-task-btn" class="btn-soft btn-primary w-full py-3 text-sm"> Add Task </button>
      </div><!-- Filters -->
      <div class="flex items-center gap-3 px-2"><span class="filter-btn active" data-filter="all">All</span> <span style="color: rgba(0,0,0,0.2);">·</span> <span class="filter-btn" data-filter="pending">Pending</span> <span style="color: rgba(0,0,0,0.2);">·</span> <span class="filter-btn" data-filter="completed">Completed</span>
      </div><!-- Task List -->
      <div id="task-list" class="space-y-3"><!-- Tasks appear here -->
      </div><!-- Empty State -->
      <div id="empty-state" class="journal-card p-12 text-center hidden">
       <p class="text-sm" style="color: rgba(0,0,0,0.3); font-style: italic;">No tasks yet. Add one above to begin.</p>
      </div>
     </div><!-- Sidebar -->
     <div class="space-y-6"><!-- Progress -->
      <div class="journal-card p-5">
       <h3 class="text-sm font-normal mb-4" style="color: rgba(0,0,0,0.6);">Today's Progress</h3>
       <div class="mb-3">
        <div class="flex justify-between text-xs mb-2" style="color: rgba(0,0,0,0.5);"><span id="progress-text">0 completed / 0 total</span> <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-bg">
         <div class="progress-bar-fill" id="progress-bar" style="width: 0%"></div>
        </div>
       </div>
      </div><!-- Quick Stats -->
      <div class="journal-card p-5">
       <h3 class="text-sm font-normal mb-4" style="color: rgba(0,0,0,0.6);">Quick Stats</h3>
       <div class="space-y-3">
        <div class="stat-card">
         <div class="text-xs" style="color: rgba(0,0,0,0.5);">
          High Priority Tasks
         </div>
         <div class="text-2xl font-light mt-1" style="color: #000;" id="stat-high-priority">
          0
         </div>
        </div>
        <div class="stat-card">
         <div class="text-xs" style="color: rgba(0,0,0,0.5);">
          Due Today
         </div>
         <div class="text-2xl font-light mt-1" style="color: #000;" id="stat-due-today">
          0
         </div>
        </div>
        <div class="stat-card">
         <div class="text-xs" style="color: rgba(0,0,0,0.5);">
          Overdue
         </div>
         <div class="text-2xl font-light mt-1" style="color: #000;" id="stat-overdue">
          0
         </div>
        </div>
       </div>
      </div><!-- Quick Actions -->
      <div class="journal-card p-5">
       <h3 class="text-sm font-normal mb-4" style="color: rgba(0,0,0,0.6);">Quick Actions</h3>
       <div class="space-y-2"><button id="clear-completed-btn" class="btn-soft w-full py-2 text-xs text-left px-3" style="color: rgba(0,0,0,0.7);"> Clear Completed Tasks </button> <button id="mark-all-btn" class="btn-soft w-full py-2 text-xs text-left px-3" style="color: rgba(0,0,0,0.7);"> Mark All as Complete </button> <button id="export-btn" class="btn-soft w-full py-2 text-xs text-left px-3" style="color: rgba(0,0,0,0.7);"> Export Tasks </button>
       </div>
      </div>
     </div>
    </div>
   </div>
  </div>
<script>
  

  let tasks = [];
  let currentFilter = "all";

  /* ---------- STORAGE ---------- */
  
  async function loadTasks() {
  try {
    const res = await fetch("/api/todos");
    const data = await res.json();

    if (!data.isOk) throw new Error("Failed to load");

    tasks = data.todos;
    renderTasks();
    updateStats();
  } catch (err) {
    console.error(err);
    alert("Error loading tasks");
  }
}

  /* ---------- INIT ---------- */
  function initApp() {
    loadTasks();
    updateCurrentDate();
   
  }

  function updateCurrentDate() {
    const now = new Date();
    document.getElementById("current-date").textContent =
      now.toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      });
  }

  /* ---------- TASK CRUD ---------- */
  async function addTask() {
  const text = taskInput.value.trim();
  if (!text) return;

  const payload = {
    id: Date.now().toString(),
    text,
    category: categorySelect.value || null,
    priority: prioritySelect.value || null,
    dueDate: dueDateInput.value || null,
    createdAt: new Date().toISOString()
  };

  try {
    const res = await fetch("/api/todos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    if (!data.isOk) throw new Error("Save failed");

    tasks.unshift(payload);
    renderTasks();
    updateStats();

    taskInput.value = "";
    categorySelect.value = "";
    prioritySelect.value = "";
    dueDateInput.value = "";

  } catch (err) {
    console.error(err);
    alert("Could not save task");
  }
}


 async function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  const updatedStatus = !task.completed;

  try {
    const res = await fetch(`/api/todos/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ completed: updatedStatus })
    });

    const data = await res.json();
    if (!data.isOk) throw new Error("Update failed");

    task.completed = updatedStatus;
    renderTasks();
    updateStats();
    triggerTodoResponse(updatedStatus ? "completed" : "unchecked");


  } catch (err) {
    console.error(err);
    alert("Failed to update task");
  }
}


  async function deleteTask(id) {
  try {
    const res = await fetch(`/api/todos/${id}`, {
      method: "DELETE"
    });

    const data = await res.json();
    if (!data.isOk) throw new Error("Delete failed");

    tasks = tasks.filter(t => t.id !== id);
    renderTasks();
    updateStats();

  } catch (err) {
    console.error(err);
    alert("Failed to delete task");
  }
}


  /* ---------- FILTER ---------- */
  function getFilteredTasks() {
    if (currentFilter === "pending") return tasks.filter(t => !t.completed);
    if (currentFilter === "completed") return tasks.filter(t => t.completed);
    return tasks;
  }

  /* ---------- RENDER ---------- */
  function renderTasks() {
    taskList.innerHTML = "";
    const filtered = getFilteredTasks();

    if (filtered.length === 0) {
      emptyState.classList.remove("hidden");
      return;
    }

    emptyState.classList.add("hidden");

    filtered.forEach(task => {
      const row = document.createElement("div");
      row.className = `task-row p-4 flex items-start gap-3 ${task.completed ? "completed" : ""}`;

      row.innerHTML = `
        <div class="checkbox">${task.completed ? "✓" : ""}</div>
        <div class="flex-1 min-w-0">
          <div class="task-text text-sm mb-2 ${task.completed ? "completed" : ""}">
            ${task.text}
          </div>
        </div>
        <div class="delete-btn">×</div>
      `;

      row.querySelector(".checkbox").onclick = () => toggleTask(task.id);
      row.querySelector(".delete-btn").onclick = () => deleteTask(task.id);

      taskList.appendChild(row);
    });
  }

  /* ---------- STATS ---------- */
  function updateStats() {
    const total = tasks.length;
    const completed = tasks.filter(t => t.completed).length;
    const percent = total ? Math.round((completed / total) * 100) : 0;

    progressText.textContent = `${completed} completed / ${total} total`;
    progressPercent.textContent = `${percent}%`;
    progressBar.style.width = percent + "%";

    statHighPriority.textContent =
      tasks.filter(t => !t.completed && t.priority === "high").length;

    const today = new Date().toDateString();

    statDueToday.textContent =
      tasks.filter(t => t.dueDate && new Date(t.dueDate).toDateString() === today && !t.completed).length;

    statOverdue.textContent =
      tasks.filter(t => t.dueDate && new Date(t.dueDate) < new Date() && !t.completed).length;
  }

  /* ---------- QUICK ACTIONS ---------- */
  async function clearCompleted() {
  try {
    const res = await fetch("/api/todos/clear-completed", {
      method: "DELETE"
    });

    const data = await res.json();
    if (!data.isOk) throw new Error();

    tasks = tasks.filter(t => !t.completed);
    renderTasks();
    updateStats();

  } catch (err) {
    alert("Failed to clear completed tasks");
  }
}


 async function markAllComplete() {
  try {
    const res = await fetch("/api/todos/mark-all", {
      method: "PUT"
    });

    const data = await res.json();
    if (!data.isOk) throw new Error();

    tasks.forEach(t => t.completed = true);
    renderTasks();
    updateStats();

  } catch (err) {
    alert("Failed to update tasks");
  }
}


  function exportTasks() {
    if (!tasks.length) return alert("No tasks to export");

    const csv = [
      ["Task", "Completed"],
      ...tasks.map(t => [t.text, t.completed ? "Yes" : "No"])
    ].map(r => r.join(",")).join("\n");

    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "mirror_tasks.csv";
    a.click();
  }

  /* ---------- DOM ---------- */
  const taskInput = document.getElementById("task-input");
  const categorySelect = document.getElementById("category-select");
  const prioritySelect = document.getElementById("priority-select");
  const dueDateInput = document.getElementById("due-date-input");

  const taskList = document.getElementById("task-list");
  const emptyState = document.getElementById("empty-state");

  const progressText = document.getElementById("progress-text");
  const progressPercent = document.getElementById("progress-percent");
  const progressBar = document.getElementById("progress-bar");

  const statHighPriority = document.getElementById("stat-high-priority");
  const statDueToday = document.getElementById("stat-due-today");
  const statOverdue = document.getElementById("stat-overdue");

  document.getElementById("add-task-btn").onclick = addTask;
  document.getElementById("clear-completed-btn").onclick = clearCompleted;
  document.getElementById("mark-all-btn").onclick = markAllComplete;
  document.getElementById("export-btn").onclick = exportTasks;

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      renderTasks();
    };
  });
const todoResponses = {
  completed: [
    "Nice, that’s done 💛",
    "One less thing to worry about.",
    "That effort counts.",
    "Progress looks good on you."
  ],
  unchecked: [
    "All good — you can come back to it.",
    "No pressure. Things shift.",
    "Want to break it into a smaller step?",
    "Pausing is allowed."
  ]
};

function triggerTodoResponse(type) {
  const responses = todoResponses[type];
  if (!responses) return;

  const reply = responses[Math.floor(Math.random() * responses.length)];

  // open chatbot automatically
  chatWindow.classList.remove('hidden');
  chatWindow.classList.add('open'); 

  setTimeout(() => {
    addChatMessage(reply, 'bot');
  }, 400);
}

  initApp();
const chatToggle = document.getElementById('chat-toggle');
const chatWindow = document.getElementById('chat-window');
const chatMessages = document.getElementById('chat-messages');

chatToggle.addEventListener('click', () => {
  chatWindow.classList.toggle('hidden');

  if (!chatWindow.classList.contains('hidden') && chatMessages.children.length === 0) {
    addChatMessage("I’m here if you need me 💬", 'bot');
  }
});

function addChatMessage(text, from = 'bot') {
  const div = document.createElement('div');
  div.className =
    from === 'bot'
      ? 'bg-white/60 p-2 rounded ink-text'
      : 'text-right ink-text';
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}


</script>
